---
tasks:
  java-maven-linux:
    name: "Maven Java App"
    platform: ubuntu2004
    working_directory: ../java-maven
    build_targets:
    - "..."
    test_targets:
    - "..."
    test_flags:
    # NOTE: BazelCI no longer supports Docker container spawning, so the
    # Docker-related tests can no longer be run in CI.
    - "--test_tag_filters=-requires-docker"
  java-maven-macos:
    name: "Maven Java App"
    platform: macos
    environment:
      ANDROID_HOME: ""
      ANDROID_NDK_HOME: ""
    working_directory: ../java-maven
    build_targets:
    - "..."
    test_targets:
    - "..."
  java-maven-windows:
    name: "Maven Java App"
    platform: windows
    working_directory: ../java-maven
    build_targets:
    - "..."
    test_targets:
    - "..."

  third-party-dependencies-linux:
    name: "Example with third party dependencies"
    platform: ubuntu2204
    working_directory: ../third-party-dependencies
    build_targets:
    - "..."
  third-party-dependencies-macos:
    name: "Example with third party dependencies"
    platform: macos_arm64
    working_directory: ../third-party-dependencies
    build_targets:
    - "..."
  third-party-dependencies-windows:
    name: "Example with third party dependencies"
    platform: windows
